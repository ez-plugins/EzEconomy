# MySQL Database Configuration
mysql:
  host: localhost
  port: 3306
  database: ezeconomy
  username: root
  password: password
  table: balances

  # JDBC connection parameters appended to the JDBC URL. Adjust to match your server.
  # Includes UTF-8 encoding and common performance options for modern MySQL servers.
  jdbc-params: "useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&cachePrepStmts=true&prepStmtCacheSize=1024&prepStmtCacheSqlLimit=4096&useServerPrepStmts=true&elideSetAutoCommits=true&maintainTimeStats=false&useLocalSessionState=true&rewriteBatchedStatements=true&cacheResultSetMetadata=true&cacheServerConfiguration=true&tcpKeepAlive=true&connectTimeout=8000&socketTimeout=30000"

  # Background persistence tuning (balance delta aggregation and flush)
  # These control the background queue size, batching and flush frequency
  # used by the balance background persistence worker.
  background-queue-size: 10000
  balance-background-queue-size: 10000
  balance-background-batch-size: 128
  # Frequency (ms) the background balance flusher wakes to persist aggregated deltas
  balance-background-flush-interval-ms: 200

  pool:
    enabled: true
    maximum-pool-size: 32
    minimum-idle: 8
    connection-timeout-ms: 8000
    idle-timeout-ms: 240000
    max-lifetime-ms: 1200000
    # Optional Hikari tuning (leave default unless you know what you're changing)
    leak-detection-threshold-ms: 0
    validation-timeout-ms: 500
    initialization-fail-timeout-ms: 1
    auto-commit: true
