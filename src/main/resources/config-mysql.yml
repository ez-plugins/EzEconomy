# MySQL Database Configuration
mysql:
  host: localhost
  port: 3306
  database: ezeconomy
  username: root
  password: password
  table: balances
  jdbc-params: "useSSL=false&serverTimezone=UTC&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&elideSetAutoCommits=true&maintainTimeStats=false&useLocalSessionState=true&rewriteBatchedStatements=true&cacheResultSetMetadata=true&cacheServerConfiguration=true"
  pool:
    enabled: true
    maximum-pool-size: 16
    minimum-idle: 4
    connection-timeout-ms: 10000
    idle-timeout-ms: 120000
    max-lifetime-ms: 900000
