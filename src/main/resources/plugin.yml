name: EzEconomy
main: com.skyblockexp.ezeconomy.core.EzEconomyPlugin
version: ${project.version}
website: https://modrinth.com/plugin/ezeconomy
author: Shadow48402
api-version: 26.1.2
description: Vault-compatible economy provider with YML and MySQL support
depend: [Vault]
softdepend: [PlaceholderAPI]

commands:
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player] [currency]
    aliases: [bal]
  eco:
    description: Admin economy control (give, take, set)
    usage: /eco <give|take|set> <player> <amount> [currency]
  baltop:
    description: Show top player balances
    usage: /baltop [amount]
  bank:
    description: Bank management commands
    usage: /bank <create|delete|balance|deposit|withdraw|addmember|removemember|info> ...
  pay:
    description: Pay money to another player or all players
    usage: /pay <player|*> <amount> [currency]
  payall:
    description: Pay money to all players (alias for /pay *)
    usage: /payall <amount> [currency]
  currency:
    description: View or set your preferred currency
    usage: /currency [currency]
  ezeconomy:
    description: EzEconomy admin utilities
    usage: /ezeconomy <daily reset>

permissions:
  ezeconomy.payall:
    description: Allows using /pay * to pay all players
    default: op
  ezeconomy.payall.bypasswithdraw:
    description: Allows paying all without withdrawing from sender balance
    default: op
