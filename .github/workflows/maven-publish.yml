# DEPRECATED: Superseded by release.yml (tag-triggered) and nightly.yml.
# Kept as a manual fallback only. Do NOT re-enable the release: [created] trigger
# as it would conflict with release.yml which creates the GitHub Release itself.

name: Maven Package (Legacy)

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Resolve version from release tag
      id: meta
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build with Maven
      run: |
        mvn -B -ntp -U -DskipTests \
          -Dmockbukkit.groupId=org.mockbukkit.mockbukkit \
          -Dmockbukkit.artifactId=mockbukkit-v26.1.2 \
          -Dmockbukkit.version=4.113.1 \
          package

    - name: Check if package version already published
      id: check_package
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -e
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        GROUP=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
        ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
        REPO=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
        GROUP_PATH=$(echo "$GROUP" | tr '.' '/')
        URL="https://maven.pkg.github.com/${OWNER}/${REPO}/${GROUP_PATH}/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}.pom"
        echo "Checking $URL"
        STATUS=$(curl -o /dev/null -s -w "%{http_code}" -H "Authorization: Bearer $GITHUB_TOKEN" -I "$URL") || true
        echo "status=$STATUS" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Packages Apache Maven
      if: steps.check_package.outputs.status != '200'
      run: |
        mvn -B -ntp -U -DskipTests \
          -Dmockbukkit.groupId=org.mockbukkit.mockbukkit \
          -Dmockbukkit.artifactId=mockbukkit-v26.1.2 \
          -Dmockbukkit.version=4.113.1 \
          deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Skip publish if already exists
      if: steps.check_package.outputs.status == '200'
      run: |
        echo "Package version already exists on GitHub Packages (HTTP 200). Skipping deploy to avoid 422 Unprocessable Entity error."

    # 
    #  UPLOAD ARTIFACTS TO GITHUB RELEASE
    # 
    - name: Upload module jars to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          ezeconomy-bukkit/target/ezeconomy-bukkit-*.jar \
          ezeconomy-papi/target/ezeconomy-papi-*.jar \
          ezeconomy-redis/target/ezeconomy-redis-*.jar \
          ezeconomy-bungeecord/target/ezeconomy-bungeecord-*.jar \
          ezeconomy-bungeecord-proxy/target/ezeconomy-bungeecord-proxy-*.jar

    # 
    #  MODRINTH RELEASE
    # 
    - name: Release to Modrinth (stable)
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ezeconomy
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: true
        name: "EzEconomy ${{ steps.meta.outputs.version }}"
        version: "${{ steps.meta.outputs.version }}"
        version-type: release
        files: |
          ezeconomy-bukkit/target/ezeconomy-bukkit-*.jar
          ezeconomy-papi/target/ezeconomy-papi-*.jar
          ezeconomy-redis/target/ezeconomy-redis-*.jar
          ezeconomy-bungeecord/target/ezeconomy-bungeecord-*.jar
          ezeconomy-bungeecord-proxy/target/ezeconomy-bungeecord-proxy-*.jar
        game-versions: |
          1.17.1
          1.18.2
          1.19.4
          1.20.6
          1.21.11
        game-versions-filter: release
        loaders: |
          bukkit
          spigot
          paper
          purpur
          folia
        changelog: ${{ github.event.release.body }}


