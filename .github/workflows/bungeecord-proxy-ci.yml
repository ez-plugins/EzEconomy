name: BungeeCord-Proxy module CI

on:
  pull_request:
    paths:
      - 'ezeconomy-bungeecord-proxy/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'ezeconomy-bungeecord-proxy/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-v2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-v2-

      - name: Build and install MockBukkit minecraft/v26
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          cd /tmp/MockBukkit
          COMMIT=$(git rev-parse --short HEAD)
          ./gradlew publishToMavenLocal -xtest -xjavadoc
          echo "MOCKBUKKIT_VERSION=dev-${COMMIT}" >> $GITHUB_ENV

      - name: Build and test BungeeCord-Proxy module
        run: mvn -B -DskipTests=false -Dmockbukkit.version=$MOCKBUKKIT_VERSION -pl ezeconomy-bungeecord-proxy -am clean test package
