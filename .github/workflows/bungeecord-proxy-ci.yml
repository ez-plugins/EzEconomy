name: BungeeCord-Proxy module CI

on:
  pull_request:
    paths:
      - 'ezeconomy-bungeecord-proxy/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'ezeconomy-bungeecord-proxy/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and install MockBukkit dev/26.1.1
        run: |
          git clone --depth=1 --branch dev/26.1.1 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and test BungeeCord-Proxy module
        run: mvn -B -DskipTests=false -pl ezeconomy-bungeecord-proxy -am clean test package
