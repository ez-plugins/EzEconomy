name: Stable Release

# Fires when a vX.Y.Z tag is pushed, or can be triggered manually with a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.3)'
        required: true

jobs:
  release:
    name: Stable Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub release & push tag
      packages: write   # publish to GitHub Packages

    steps:
      # 
      #  1. CHECKOUT
      # 
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 
      #  2. RESOLVE VERSION
      # 
      - name: Resolve version from tag
        id: meta
        run: |
          RAW_REF="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$RAW_REF" == v* ]]; then
            REF="$RAW_REF"
          else
            REF="v${RAW_REF}"
          fi
          VERSION="${REF#v}"
          echo "ref=${REF}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      # 
      #  3. CREATE TAG (if it doesn't exist yet)
      #
      #  When triggered via workflow_dispatch the tag may not exist yet.
      #  This step creates and pushes it so the GitHub Release can reference it.
      # 
      - name: Create and push tag if missing
        run: |
          REF="${{ steps.meta.outputs.ref }}"
          if git rev-parse --verify --quiet "refs/tags/${REF}" > /dev/null; then
            echo "Tag ${REF} already exists; skipping creation."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${REF}"
            git push origin "${REF}"
            echo "Created and pushed tag ${REF}."
          fi

      # 
      #  4. BUILD
      # 
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set release version in all POMs
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="${{ steps.meta.outputs.version }}" \
            -DprocessAllModules \
            -DgenerateBackupPoms=false

      - name: Build
        run: |
          mkdir -p dist

          # Build legacy lane (Java 17-safe runtime for MC 1.17-1.20.x).
          mvn -B -ntp -U -Dmaven.test.skip=true \
            -Dmockbukkit.groupId=org.mockbukkit.mockbukkit \
            -Dmockbukkit.artifactId=mockbukkit-v26.1.2 \
            -Dmockbukkit.version=4.113.1 \
            package

          cp "ezeconomy-bukkit/target/ezeconomy-bukkit-${{ steps.meta.outputs.version }}.jar" "dist/ezeconomy-bukkit-${{ steps.meta.outputs.version }}-legacy.jar"
          cp "ezeconomy-papi/target/ezeconomy-papi-${{ steps.meta.outputs.version }}.jar" "dist/ezeconomy-papi-${{ steps.meta.outputs.version }}.jar"
          cp "ezeconomy-redis/target/ezeconomy-redis-${{ steps.meta.outputs.version }}.jar" "dist/ezeconomy-redis-${{ steps.meta.outputs.version }}.jar"
          cp "ezeconomy-bungeecord/target/ezeconomy-bungeecord-${{ steps.meta.outputs.version }}.jar" "dist/ezeconomy-bungeecord-${{ steps.meta.outputs.version }}.jar"
          cp "ezeconomy-bungeecord-proxy/target/ezeconomy-bungeecord-proxy-${{ steps.meta.outputs.version }}.jar" "dist/ezeconomy-bungeecord-proxy-${{ steps.meta.outputs.version }}.jar"

          # Build modern lane (Java 21+ runtime for MC 1.21.x) for Bukkit only.
          mvn -B -ntp -U -Dmaven.test.skip=true \
            -Dbytecode.split=modern \
            -Dmockbukkit.groupId=org.mockbukkit.mockbukkit \
            -Dmockbukkit.artifactId=mockbukkit-v26.1.2 \
            -Dmockbukkit.version=4.113.1 \
            -pl ezeconomy-bukkit -am package

          cp "ezeconomy-bukkit/target/ezeconomy-bukkit-${{ steps.meta.outputs.version }}.jar" "dist/ezeconomy-bukkit-${{ steps.meta.outputs.version }}-modern.jar"

      # 
      #  5. EXTRACT CHANGELOG
      #
      #  Reads the section for this version from CHANGELOG.md.
      #  Falls back gracefully when the section is missing.
      # 
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          HEADER="## [${VERSION}]"

          # Fixed-string match via index() avoids regex issues with dots in versions.
          NOTES=$(awk \
            -v hdr="$HEADER" \
            '/^## \[/ && p { exit }
             index($0, hdr) == 1 { p=1; next }
             p { print }' \
            CHANGELOG.md)

          if [[ -z "$NOTES" ]]; then
            NOTES="No changelog entry found for ${VERSION}. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full history."
          fi

          printf '%s\n' "$NOTES" > release-notes.md
          echo "=== Release notes preview ===" && cat release-notes.md

      # 
      #  6. GITHUB RELEASE
      # 
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          gh release create "${{ steps.meta.outputs.ref }}" \
            --title "EzEconomy ${VERSION}" \
            --notes-file release-notes.md \
            "dist/ezeconomy-bukkit-${VERSION}-legacy.jar" \
            "dist/ezeconomy-bukkit-${VERSION}-modern.jar" \
            "dist/ezeconomy-papi-${VERSION}.jar" \
            "dist/ezeconomy-redis-${VERSION}.jar" \
            "dist/ezeconomy-bungeecord-${VERSION}.jar" \
            "dist/ezeconomy-bungeecord-proxy-${VERSION}.jar"

      # 
      #  7. GITHUB PACKAGES
      # 
      - name: Publish to GitHub Packages
        continue-on-error: true   # don't fail if the version already exists
        run: mvn -B -ntp -Dmaven.test.skip=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 
      #  8. MODRINTH RELEASES (split by runtime lane)
      # 
      - name: Release to Modrinth (legacy lane)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ezeconomy
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: "EzEconomy ${{ steps.meta.outputs.version }} (legacy lane)"
          version: "${{ steps.meta.outputs.version }}-legacy"
          version-type: release
          files: |
            dist/ezeconomy-bukkit-${{ steps.meta.outputs.version }}-legacy.jar
            dist/ezeconomy-papi-${{ steps.meta.outputs.version }}.jar
            dist/ezeconomy-redis-${{ steps.meta.outputs.version }}.jar
            dist/ezeconomy-bungeecord-${{ steps.meta.outputs.version }}.jar
            dist/ezeconomy-bungeecord-proxy-${{ steps.meta.outputs.version }}.jar
          game-versions: |
            1.17
            1.17.1
            1.18
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
          game-versions-filter: release
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          changelog-file: release-notes.md
          dependencies: |
            placeholderapi(optional)

      - name: Release to Modrinth (modern lane)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ezeconomy
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: "EzEconomy ${{ steps.meta.outputs.version }} (modern lane)"
          version: "${{ steps.meta.outputs.version }}-modern"
          version-type: release
          files: |
            dist/ezeconomy-bukkit-${{ steps.meta.outputs.version }}-modern.jar
            dist/ezeconomy-papi-${{ steps.meta.outputs.version }}.jar
            dist/ezeconomy-redis-${{ steps.meta.outputs.version }}.jar
            dist/ezeconomy-bungeecord-${{ steps.meta.outputs.version }}.jar
            dist/ezeconomy-bungeecord-proxy-${{ steps.meta.outputs.version }}.jar
          game-versions: ">=1.21"
          game-versions-filter: release
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          changelog-file: release-notes.md
          dependencies: |
            placeholderapi(optional)

      # 
      #  9. DISCORD NOTIFICATION
      # 
      - name: Post Discord notification
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.EZECONOMY_RELEASE_DISCORD_WEBHOOK }}
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.meta.outputs.version }}"
          REF="${{ steps.meta.outputs.ref }}"
          GH_URL="https://github.com/${REPO}/releases/tag/${REF}"
          MODRINTH_LEGACY_URL="https://modrinth.com/plugin/ezeconomy/version/${VERSION}-legacy"
          MODRINTH_MODERN_URL="https://modrinth.com/plugin/ezeconomy/version/${VERSION}-modern"

          # Truncate changelog to fit Discord embed description limit (4096 chars).
          CHANGELOG=$(head -c 3800 release-notes.md || true)

          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg gh_url  "$GH_URL" \
            --arg mr_legacy_url "$MODRINTH_LEGACY_URL" \
            --arg mr_modern_url "$MODRINTH_MODERN_URL" \
            --arg log     "$CHANGELOG" \
            '{
              embeds: [{
                title:       (" EzEconomy " + $version + "  Stable Release"),
                url:         $gh_url,
                color:       3447003,
                description: $log,
                fields: [
                  { name: "GitHub Release", value: ("[View on GitHub]("      + $gh_url + ")"), inline: true },
                  { name: "Modrinth Legacy", value: ("[Download Legacy](" + $mr_legacy_url + ")"), inline: true },
                  { name: "Modrinth Modern", value: ("[Download Modern](" + $mr_modern_url + ")"), inline: true }
                ],
                footer: { text: "EzEconomy  Stable Release" }
              }]
            }')

          curl --fail -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"


