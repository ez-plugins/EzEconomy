name: Feature tests

on:
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'ezeconomy-bungeecord/**'
      - 'ezeconomy-bungeecord-proxy/**'
      - 'ezeconomy-papi/**'
      - 'ezeconomy-bukkit/**'
      - 'ezeconomy-redis/**'
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'ezeconomy-bungeecord/**'
      - 'ezeconomy-bungeecord-proxy/**'
      - 'ezeconomy-papi/**'
      - 'ezeconomy-bukkit/**'
      - 'ezeconomy-redis/**'

jobs:
  feature-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - paper-version: "[26.1.2.build,)"
            mockbukkit-artifactId: "mockbukkit-v26.1.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-v2-feature-${{ matrix.paper-version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-v2-feature-${{ matrix.paper-version }}-

      - name: Build and install MockBukkit minecraft/v26
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          cd /tmp/MockBukkit
          COMMIT=$(git rev-parse --short HEAD)
          ./gradlew publishToMavenLocal -xtest -xjavadoc
          echo "MOCKBUKKIT_VERSION=dev-${COMMIT}" >> $GITHUB_ENV

      - name: Run feature tests
        run: mvn -B -Dpaper.version=${{ matrix.paper-version }} -Dmockbukkit.artifactId=${{ matrix.mockbukkit-artifactId }} -Dmockbukkit.version=$MOCKBUKKIT_VERSION -Pfeature-tests -Dtest=*FeatureTest test
