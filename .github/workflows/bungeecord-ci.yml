name: BungeeCord module CI

on:
  pull_request:
    paths:
      - 'ezeconomy-bungeecord/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'ezeconomy-bungeecord/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and install MockBukkit dev/26.1.1
        run: |
          git clone --depth=1 --branch dev/26.1.1 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          cd /tmp/MockBukkit
          COMMIT=$(git rev-parse --short HEAD)
          ./gradlew publishToMavenLocal -xtest -xjavadoc
          echo "MOCKBUKKIT_VERSION=dev-${COMMIT}" >> $GITHUB_ENV

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and test BungeeCord module
        run: mvn -B -DskipTests=false -Dmockbukkit.version=$MOCKBUKKIT_VERSION -pl ezeconomy-bungeecord -am clean test package
