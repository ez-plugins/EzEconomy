name: BungeeCord module CI

on:
  pull_request:
    paths:
      - 'ezeconomy-bungeecord/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'ezeconomy-bungeecord/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-v2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-v2-

      - name: Print resolved adventure-api version
        run: |
          mvn -B -Dpaper.version=26.1.2.build.57-stable -Dmockbukkit.groupId=org.mockbukkit.mockbukkit -Dmockbukkit.artifactId=mockbukkit-v26.1.2 -Dmockbukkit.version=4.113.1 -pl ezeconomy-bungeecord -am dependency:tree -Dincludes="net.kyori:adventure-api" --no-transfer-progress 2>&1 | grep -E "adventure-api|BUILD" || true

      - name: Build and test BungeeCord module
        run: mvn -B -DskipTests=false -Dpaper.version=26.1.2.build.57-stable -Dmockbukkit.groupId=org.mockbukkit.mockbukkit -Dmockbukkit.artifactId=mockbukkit-v26.1.2 -Dmockbukkit.version=4.113.1 -pl ezeconomy-bungeecord -am clean test package

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-bungeecord
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn

