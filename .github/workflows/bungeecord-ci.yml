name: BungeeCord module CI

on:
  pull_request:
    paths:
      - 'ezeconomy-bungeecord/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'ezeconomy-bungeecord/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and test BungeeCord module
        run: mvn -B -DskipTests=false -Dmockbukkit.artifactId=mockbukkit-v1.21 -Dmockbukkit.version=4.101.0 -pl ezeconomy-bungeecord -am clean test package
