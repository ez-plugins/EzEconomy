name: Unit tests

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'ezeconomy-bungeecord/**'
      - 'ezeconomy-bungeecord-proxy/**'
      - 'ezeconomy-papi/**'
      - 'ezeconomy-bukkit/**'
      - 'ezeconomy-redis/**'
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'ezeconomy-bungeecord/**'
      - 'ezeconomy-bungeecord-proxy/**'
      - 'ezeconomy-papi/**'
      - 'ezeconomy-bukkit/**'
      - 'ezeconomy-redis/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - paper-version: "[26.1.2.build,)"
            mockbukkit-artifactId: "mockbukkit-v26.1.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-v2-${{ matrix.paper-version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-v2-${{ matrix.paper-version }}-

      - name: Build and install MockBukkit minecraft/v26
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          cd /tmp/MockBukkit
          COMMIT=$(git rev-parse --short HEAD)
          ./gradlew publishToMavenLocal -xtest -xjavadoc
          echo "MOCKBUKKIT_VERSION=dev-${COMMIT}" >> $GITHUB_ENV

      - name: Run unit tests (exclude feature tests) and generate JaCoCo report
        run: mvn -B -Dpaper.version=${{ matrix.paper-version }} -Dmockbukkit.artifactId=${{ matrix.mockbukkit-artifactId }} -Dmockbukkit.version=$MOCKBUKKIT_VERSION -Dtest='!*FeatureTest' -Dsurefire.failIfNoSpecifiedTests=false test jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Compute coverage summary
        run: |
          python3 .github/scripts/coverage_summary.py --metric LINE --output coverage-summary.md

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage-summary.md

      - name: Post coverage summary comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: coverage-summary.md
          edit-mode: replace
          identifier: coverage-summary
