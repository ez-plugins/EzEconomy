name: Redis integration module CI

on:
  pull_request:
    paths:
      - 'ezeconomy-redis/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'ezeconomy-redis/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-v2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-v2-

      - name: Build and test Redis module
        run: mvn -B -DskipTests=false -Dpaper.version=26.1.2.build.57-stable -Dmockbukkit.groupId=org.mockbukkit.mockbukkit -Dmockbukkit.artifactId=mockbukkit-v26.1.2 -Dmockbukkit.version=4.113.1 -pl ezeconomy-redis -am clean test package

