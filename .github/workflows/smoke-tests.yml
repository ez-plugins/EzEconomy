name: Server Smoke Tests

# Verify that EzEconomy loads cleanly on real servers across Java 17-era and
# modern Minecraft lines, while keeping a fast PR lane.

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master, 'feat/**' ]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  build-plugin:
    name: Build plugin JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-smoke-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-smoke-

      - name: Package plugin (skip tests)
        run: |
          # Keep packaging isolated from test-only local Maven artifacts.
          # MockBukkit publication can override coordinates in ~/.m2 and break compile classpath.
          mvn -B -ntp -U -Dmaven.test.skip=true \
            -Dmockbukkit.groupId=com.github.seeseemelk \
            -Dmockbukkit.artifactId=MockBukkit-v1.21 \
            -Dmockbukkit.version=3.133.2 \
            -pl ezeconomy-bukkit -am package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: ezeconomy-bukkit/target/ezeconomy-bukkit-*.jar
          retention-days: 1

  smoke-pr:
    name: PR Smoke - ${{ matrix.server }} / MC ${{ matrix.mc }} / Java ${{ matrix.java }}
    if: github.event_name != 'schedule'
    needs: build-plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: paper
            mc: '1.20.6'
            java: '17'
          - server: folia
            mc: '1.20.6'
            java: '17'
          - server: paper
            mc: '1.21.11'
            java: '21'

    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v7
        with:
          name: plugin-jar
          path: plugin-jar

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Resolve ${{ matrix.server }} ${{ matrix.mc }} build
        if: matrix.server != 'spigot'
        id: server-meta
        run: |
          PROJECT="${{ matrix.server }}"
          MC="${{ matrix.mc }}"
          DATA=$(curl -sSf "https://api.papermc.io/v2/projects/${PROJECT}/versions/${MC}/builds")
          BUILD=$(echo "$DATA" | jq '([.builds[] | select(.channel == "default")] | last | .build) // (.builds | last | .build)')
          JAR="${PROJECT}-${MC}-${BUILD}.jar"
          URL="https://api.papermc.io/v2/projects/${PROJECT}/versions/${MC}/builds/${BUILD}/downloads/${JAR}"
          echo "build=${BUILD}" >> $GITHUB_OUTPUT
          echo "jar=${JAR}" >> $GITHUB_OUTPUT
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Cache server JAR
        if: matrix.server != 'spigot'
        id: cache-server
        uses: actions/cache@v5
        with:
          path: server-jar/${{ steps.server-meta.outputs.jar }}
          key: serverjar-${{ matrix.server }}-${{ matrix.mc }}-${{ steps.server-meta.outputs.build }}

      - name: Download server JAR
        if: matrix.server != 'spigot' && steps.cache-server.outputs.cache-hit != 'true'
        run: |
          mkdir -p server-jar
          curl -sSfL -o "server-jar/${{ steps.server-meta.outputs.jar }}" "${{ steps.server-meta.outputs.url }}"

      - name: Download VaultUnlocked
        run: |
          mkdir -p server/plugins
          curl -sSfL -o server/plugins/Vault.jar "https://cdn.modrinth.com/data/ayRaM8J7/versions/ypDodbNn/VaultUnlocked-2.19.1.jar"

      - name: Assemble server directory
        run: |
          mkdir -p server/plugins server/logs
          cp "server-jar/${{ steps.server-meta.outputs.jar }}" server/server.jar
          cp plugin-jar/ezeconomy-bukkit-*.jar server/plugins/EzEconomy.jar
          echo "eula=true" > server/eula.txt
          cat > server/server.properties << 'PROPS'
          online-mode=false
          spawn-npcs=false
          spawn-animals=false
          spawn-monsters=false
          generate-structures=false
          level-type=flat
          view-distance=2
          simulation-distance=2
          max-players=0
          PROPS

          mkdir -p server/config
          cat > server/config/paper-global.yml << 'YAML'
          _version: 28
          proxies:
            bungee-cord:
              online-mode: false
          YAML

      - name: Start server and wait for ready
        working-directory: server
        run: |
          java -Xmx512m -Xms256m -jar server.jar --nogui < /dev/null &
          SERVER_PID=$!
          echo "SERVER_PID=${SERVER_PID}" >> $GITHUB_ENV

          TIMEOUT=180
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep 3
            ELAPSED=$((ELAPSED + 3))

            if grep -q 'Done (' logs/latest.log 2>/dev/null; then
              echo "Server ready after ${ELAPSED}s."
              exit 0
            fi

            if grep -qE 'Could not load .plugins/EzEconomy|UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' logs/latest.log 2>/dev/null; then
              echo "ABORT: critical startup failure detected"
              grep -E 'EzEconomy|UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' logs/latest.log || true
              kill "$SERVER_PID" 2>/dev/null
              exit 1
            fi
          done

          echo "TIMEOUT: server did not reach Done within ${TIMEOUT}s"
          tail -50 logs/latest.log
          kill "$SERVER_PID" 2>/dev/null
          exit 1

      - name: Assert EzEconomy started cleanly
        run: |
          LOG=server/logs/latest.log

          if ! grep -q 'Enabling EzEconomy' "$LOG"; then
            echo "FAIL: plugin did not enable"
            exit 1
          fi

          if grep -qE 'UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' "$LOG"; then
            echo "FAIL: compatibility/class loading error found"
            grep -E 'UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' "$LOG"
            exit 1
          fi

          if grep -qE '\[EzEconomy\].*ERROR|ERROR.*\[EzEconomy\]' "$LOG"; then
            echo "FAIL: ERROR lines found in EzEconomy output"
            grep -E '\[EzEconomy\].*ERROR|ERROR.*\[EzEconomy\]' "$LOG"
            exit 1
          fi

          echo "PASS: EzEconomy loaded cleanly on ${{ matrix.server }} / MC ${{ matrix.mc }} / Java ${{ matrix.java }}"

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-pr-logs-${{ matrix.server }}-mc${{ matrix.mc }}-java${{ matrix.java }}
          path: server/logs/
          retention-days: 7

  smoke-nightly:
    name: Nightly Smoke - ${{ matrix.server }} / MC ${{ matrix.mc }} / Java ${{ matrix.java }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build-plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: paper
            mc: '1.17.1'
            java: '17'
          - server: paper
            mc: '1.18.2'
            java: '17'
          - server: paper
            mc: '1.19.4'
            java: '17'
          - server: paper
            mc: '1.20.6'
            java: '17'
          - server: folia
            mc: '1.20.6'
            java: '17'
          - server: paper
            mc: '1.21.11'
            java: '21'
          - server: spigot
            mc: '1.20.6'
            java: '17'

    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v7
        with:
          name: plugin-jar
          path: plugin-jar

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Resolve ${{ matrix.server }} ${{ matrix.mc }} build
        if: matrix.server != 'spigot'
        id: server-meta
        run: |
          PROJECT="${{ matrix.server }}"
          MC="${{ matrix.mc }}"
          DATA=$(curl -sSf "https://api.papermc.io/v2/projects/${PROJECT}/versions/${MC}/builds")
          BUILD=$(echo "$DATA" | jq '([.builds[] | select(.channel == "default")] | last | .build) // (.builds | last | .build)')
          JAR="${PROJECT}-${MC}-${BUILD}.jar"
          URL="https://api.papermc.io/v2/projects/${PROJECT}/versions/${MC}/builds/${BUILD}/downloads/${JAR}"
          echo "build=${BUILD}" >> $GITHUB_OUTPUT
          echo "jar=${JAR}" >> $GITHUB_OUTPUT
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Cache server JAR
        if: matrix.server != 'spigot'
        id: cache-server
        uses: actions/cache@v5
        with:
          path: server-jar/${{ steps.server-meta.outputs.jar }}
          key: serverjar-${{ matrix.server }}-${{ matrix.mc }}-${{ steps.server-meta.outputs.build }}

      - name: Download server JAR
        if: matrix.server != 'spigot' && steps.cache-server.outputs.cache-hit != 'true'
        run: |
          mkdir -p server-jar
          curl -sSfL -o "server-jar/${{ steps.server-meta.outputs.jar }}" "${{ steps.server-meta.outputs.url }}"

      - name: Cache Spigot JAR (BuildTools output)
        if: matrix.server == 'spigot'
        id: cache-spigot
        uses: actions/cache@v5
        with:
          path: server-jar/spigot-${{ matrix.mc }}.jar
          key: spigot-jar-${{ matrix.mc }}

      - name: Build Spigot with BuildTools
        if: matrix.server == 'spigot' && steps.cache-spigot.outputs.cache-hit != 'true'
        run: |
          mkdir -p server-jar /tmp/buildtools
          curl -sSfL -o /tmp/buildtools/BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          cd /tmp/buildtools
          git config --global --add safe.directory '*'
          java -jar BuildTools.jar --rev "${{ matrix.mc }}" --nogui
          cp /tmp/buildtools/spigot-*.jar "$GITHUB_WORKSPACE/server-jar/spigot-${{ matrix.mc }}.jar"

      - name: Download VaultUnlocked
        run: |
          mkdir -p server/plugins
          curl -sSfL -o server/plugins/Vault.jar "https://cdn.modrinth.com/data/ayRaM8J7/versions/ypDodbNn/VaultUnlocked-2.19.1.jar"

      - name: Assemble server directory
        run: |
          mkdir -p server/plugins server/logs
          if [ "${{ matrix.server }}" = "spigot" ]; then
            cp "server-jar/spigot-${{ matrix.mc }}.jar" server/server.jar
          else
            cp "server-jar/${{ steps.server-meta.outputs.jar }}" server/server.jar
          fi
          cp plugin-jar/ezeconomy-bukkit-*.jar server/plugins/EzEconomy.jar
          echo "eula=true" > server/eula.txt
          cat > server/server.properties << 'PROPS'
          online-mode=false
          spawn-npcs=false
          spawn-animals=false
          spawn-monsters=false
          generate-structures=false
          level-type=flat
          view-distance=2
          simulation-distance=2
          max-players=0
          PROPS

          mkdir -p server/config
          cat > server/config/paper-global.yml << 'YAML'
          _version: 28
          proxies:
            bungee-cord:
              online-mode: false
          YAML

      - name: Start server and wait for ready
        working-directory: server
        run: |
          java -Xmx512m -Xms256m -jar server.jar --nogui < /dev/null &
          SERVER_PID=$!
          echo "SERVER_PID=${SERVER_PID}" >> $GITHUB_ENV

          TIMEOUT=180
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep 3
            ELAPSED=$((ELAPSED + 3))

            if grep -q 'Done (' logs/latest.log 2>/dev/null; then
              echo "Server ready after ${ELAPSED}s."
              exit 0
            fi

            if grep -qE 'Could not load .plugins/EzEconomy|UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' logs/latest.log 2>/dev/null; then
              echo "ABORT: critical startup failure detected"
              grep -E 'EzEconomy|UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' logs/latest.log || true
              kill "$SERVER_PID" 2>/dev/null
              exit 1
            fi
          done

          echo "TIMEOUT: server did not reach Done within ${TIMEOUT}s"
          tail -50 logs/latest.log
          kill "$SERVER_PID" 2>/dev/null
          exit 1

      - name: Assert EzEconomy started cleanly
        run: |
          LOG=server/logs/latest.log

          if ! grep -q 'Enabling EzEconomy' "$LOG"; then
            echo "FAIL: plugin did not enable"
            exit 1
          fi

          if grep -qE 'UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' "$LOG"; then
            echo "FAIL: compatibility/class loading error found"
            grep -E 'UnsupportedOperationException|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError' "$LOG"
            exit 1
          fi

          if grep -qE '\[EzEconomy\].*ERROR|ERROR.*\[EzEconomy\]' "$LOG"; then
            echo "FAIL: ERROR lines found in EzEconomy output"
            grep -E '\[EzEconomy\].*ERROR|ERROR.*\[EzEconomy\]' "$LOG"
            exit 1
          fi

          echo "PASS: EzEconomy loaded cleanly on ${{ matrix.server }} / MC ${{ matrix.mc }} / Java ${{ matrix.java }}"

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-nightly-logs-${{ matrix.server }}-mc${{ matrix.mc }}-java${{ matrix.java }}
          path: server/logs/
          retention-days: 7
