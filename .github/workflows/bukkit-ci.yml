name: Bukkit module CI

on:
  pull_request:
    paths:
      - 'ezeconomy-bukkit/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'ezeconomy-bukkit/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: legacy
            paper_version: 26.1.2.build.57-stable
            bytecode_split: ""
          - lane: modern
            paper_version: 26.2.build.49-alpha
            bytecode_split: "-Dbytecode.split=modern"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-v2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-v2-

      - name: Build and test Bukkit module (${{ matrix.lane }})
        run: |
          mvn -B -DskipTests=false \
            ${{ matrix.bytecode_split }} \
            -Dpaper.version=${{ matrix.paper_version }} \
            -Dmockbukkit.groupId=org.mockbukkit.mockbukkit \
            -Dmockbukkit.artifactId=mockbukkit-v26.1.2 \
            -Dmockbukkit.version=4.113.1 \
            -pl ezeconomy-bukkit -am clean test package


