name: Discord Issues & Comments

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send issue or comment to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEVELOPER_ROLE_ID: "1435040917575700571"
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          # When the event is an issue comment, skip notifications from known bot accounts
          if [[ "$EVENT_NAME" != "issues" ]]; then
            if [[ "$COMMENT_USER" == "codecov" || "$COMMENT_USER" == "codecov-io" || "$COMMENT_USER" == "codecov-commenter" ]]; then
              echo "Skipping notification for bot user: $COMMENT_USER"
              exit 0
            fi
          fi

          if [[ "$EVENT_NAME" == "issues" ]]; then
            jq -n \
              --arg role "<@&$DEVELOPER_ROLE_ID>" \
              --arg title "$ISSUE_TITLE" \
              --arg url "$ISSUE_URL" \
              --arg author "$ISSUE_AUTHOR" \
              --arg repo "$REPO" \
              --arg number "$ISSUE_NUMBER" \
              '{
                content: ($role + " âš ï¸ **New Issue Opened**"),
                embeds: [{
                  title: "ðŸ› #\($number) â€“ \($title)",
                  url: $url,
                  color: 15158332,
                  fields: [
                    {name: "Author", value: $author, inline: true},
                    {name: "Repository", value: $repo, inline: true}
                  ],
                  footer: { text: "GitHub Issues" }
                }]
              }' | curl -fsSL -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
          else
            TRIMMED_BODY=$(echo "${COMMENT_BODY:-[No text body]}" | head -c 1900)
            jq -n \
              --arg number "$ISSUE_NUMBER" \
              --arg user "$COMMENT_USER" \
              --arg body "$TRIMMED_BODY" \
              --arg url "$COMMENT_URL" \
              '{
                content: "ðŸ’¬ **New comment on Issue #\($number)**\n**\($user)**: \($body)\nðŸ”— \($url)"
              }' | curl -fsSL -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
          fi
